version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: aicte-iicm-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./backend/db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./backend/db/seeds/seed_data.sql:/docker-entrypoint-initdb.d/002_seed_data.sql:ro

  backend:
    build: ./backend
    container_name: aicte-iicm-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - postgres

  frontend:
    image: nginx:alpine
    container_name: aicte-iicm-web
    ports:
      - "8080:80"
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
